<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Slow API 알림에서 Trace ID로 로그 흐름을 읽는 로컬 ELK 검색 경로</title>
  <desc id="desc">왼쪽의 Slow API 알림이 요청 완료 기록과 Trace ID 검색을 거쳐 오른쪽의 시간순 로그 흐름으로 연결된다.</desc>
