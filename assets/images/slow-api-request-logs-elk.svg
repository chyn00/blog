  <path d="M551 469 L581 487 L551 505" fill="none" stroke="#68776c" stroke-width="7" stroke-linejoin="round"/>
  <rect x="601" y="322" width="396" height="324" rx="12" fill="#eef4f0" stroke="#9eb5a4" stroke-width="3"/>
  <text x="646" y="392" fill="#2c6043" font-family="Arial, sans-serif" font-size="25" font-weight="700">DISCOVER</text>
  <line x1="646" y1="419" x2="952" y2="419" stroke="#adbdaf" stroke-width="2"/>
  <g fill="#6f9d7d"><rect x="646" y="453" width="304" height="34" rx="4"/><rect x="646" y="504" width="304" height="34" rx="4"/><rect x="646" y="555" width="304" height="34" rx="4"/></g>
