---
layout: default
---
<section class="archive-shell content-browser">
  {% include writing-track-nav.html %}
  <div class="content-browser__main">
    <header class="archive-header">
      <p class="eyebrow">Writing track</p>
      <h1>{{ page.title }}</h1>
      <p>{{ page.description }}</p>
    </header>
    <div class="post-grid">
      {% assign category_posts = site.categories[page.category] %}
      {% for post in category_posts %}{% include post-card.html post=post %}{% endfor %}
    </div>
  </div>
</section>
